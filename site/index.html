<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Awesome Agent Evals — the directory for evaluating AI agents</title>
<meta name="description" content="A curated, filterable directory of tools, frameworks, and benchmarks for evaluating AI agents. Know whether your agent actually works." />
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel2:#1b2027; --bd:#262d36; --tx:#e6edf3; --mut:#9aa7b4;
    --acc:#6ee7b7; --acc2:#38bdf8; --chip:#1f2630;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f7f8fa; --panel:#ffffff; --panel2:#f0f2f5; --bd:#e2e6eb; --tx:#0d1117; --mut:#586069; --acc:#059669; --acc2:#0284c7; --chip:#eef1f5; }
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;max-width:100%}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--acc2);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1160px;margin:0 auto;padding:clamp(16px,4vw,30px) clamp(14px,4vw,26px) 60px}
  header h1{margin:0 0 4px;font-size:1.7rem;letter-spacing:-.02em}
  header h1 .g{color:var(--acc)}
  header p{margin:0;color:var(--mut)}
  .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
  .ghlink{border:1px solid var(--bd);background:var(--panel);padding:7px 12px;border-radius:8px;color:var(--tx);font-weight:600;font-size:.86rem}
  .controls{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;border-bottom:1px solid var(--bd);margin-bottom:16px}
  #q{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--panel);color:var(--tx);font-size:1rem;outline:none}
  #q:focus{border-color:var(--acc2)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .chip{cursor:pointer;border:1px solid var(--bd);background:var(--chip);color:var(--mut);padding:5px 11px;border-radius:999px;font-size:.82rem;user-select:none}
  .chip.on{background:var(--acc2);border-color:var(--acc2);color:#04121c;font-weight:700}
  .count{color:var(--mut);font-size:.82rem;margin:6px 2px 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
  .card{border:1px solid var(--bd);background:var(--panel);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:8px}
  .card:hover{border-color:var(--acc2)}
  .card .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card .h a{font-weight:700;font-size:1.02rem;color:var(--tx)}
  .stars{color:var(--mut);font-size:.8rem;white-space:nowrap}
  .cat{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--acc);font-weight:700}
  .desc{color:var(--mut);font-size:.88rem;margin:0}
  .flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .flag{font-size:.71rem;border:1px solid var(--bd);background:var(--panel2);color:var(--mut);padding:2px 7px;border-radius:6px}
  @media (max-width:520px){.top{flex-direction:column;align-items:flex-start}.card{padding:13px}}
  footer{margin-top:34px;color:var(--mut);font-size:.82rem;text-align:center}
  .empty{color:var(--mut);padding:40px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <header>
      <h1>Awesome <span class="g">Agent Evals</span></h1>
      <p>The filterable directory for evaluating AI agents — does yours actually work?</p>
    </header>
    <a class="ghlink" href="https://github.com/royalpinto007/awesome-agent-evals">★ Star on GitHub</a>
  </div>

  <div class="controls">
    <input id="q" type="search" placeholder="Search tools, benchmarks, guardrails…  (e.g. RAG, voice, browser, CI)" autocomplete="off" />
    <div class="chips" id="chips"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No matches. Try another term, or <a href="https://github.com/royalpinto007/awesome-agent-evals#contributing">add the tool</a>.</div>

  <footer>
    <span id="updated"></span> ·
    <a href="https://github.com/royalpinto007/awesome-agent-evals">Contribute a tool</a> ·
    built by <a href="https://royalpinto007.agentpostmortem.com">Royal Pinto</a>
  </footer>
</div>

<script>
const DATA = [{"name":"promptfoo","repo":"promptfoo/promptfoo","url":"https://github.com/promptfoo/promptfoo","category":"framework","desc":"Test prompts, agents, and RAG with declarative configs; red-teaming and CI/CD built in. Used by OpenAI and Anthropic.","host":"OSS","mode":"both","judge":true,"lang":"TS","rag":true,"stars":23728},{"name":"DeepEval","repo":"confident-ai/deepeval","url":"https://github.com/confident-ai/deepeval","category":"framework","desc":"\"Pytest for LLMs\" — a large library of metrics you assert on in unit tests.","host":"OSS","mode":"offline","judge":true,"lang":"Python","rag":true,"stars":17261},{"name":"Ragas","repo":"explodinggradients/ragas","url":"https://github.com/explodinggradients/ragas","category":"framework","desc":"Metrics focused on RAG and agent pipelines; strong on faithfulness and context quality.","host":"OSS","mode":"offline","judge":true,"lang":"Python","rag":true,"stars":15032},{"name":"OpenAI Evals","repo":"openai/evals","url":"https://github.com/openai/evals","category":"framework","desc":"The original framework plus an open registry of benchmarks for evaluating LLMs and systems.","host":"OSS","mode":"offline","judge":true,"lang":"Python","rag":false,"stars":19047},{"name":"Inspect","repo":"UKGovernmentBEIS/inspect_ai","url":"https://github.com/UKGovernmentBEIS/inspect_ai","category":"framework","desc":"A rigorous evaluation framework from the UK AI Safety Institute; first-class agent and tool-use support.","host":"OSS","mode":"offline","judge":true,"lang":"Python","rag":false,"stars":2426},{"name":"Giskard","repo":"Giskard-AI/giskard","url":"https://github.com/Giskard-AI/giskard","category":"framework","desc":"Open-source testing for LLM agents; scans for vulnerabilities and quality issues.","host":"OSS","mode":"offline","judge":true,"lang":"Python","rag":true,"stars":5724},{"name":"Opik","repo":"comet-ml/opik","url":"https://github.com/comet-ml/opik","category":"framework","desc":"Trace, evaluate, and monitor LLM/RAG/agentic apps with automated evals and dashboards.","host":"OSS","mode":"both","judge":true,"lang":"Python/TS","rag":true,"stars":20961},{"name":"Langfuse","repo":"langfuse/langfuse","url":"https://github.com/langfuse/langfuse","category":"framework","desc":"Open-source LLM engineering platform: evals, observability, prompt management, datasets.","host":"OSS","mode":"both","judge":true,"lang":"Python/TS","rag":true,"stars":32101},{"name":"Phoenix","repo":"Arize-ai/phoenix","url":"https://github.com/Arize-ai/phoenix","category":"framework","desc":"AI observability and evaluation, OpenTelemetry-based (by Arize).","host":"OSS","mode":"both","judge":true,"lang":"Python","rag":true,"stars":10799},{"name":"TruLens","repo":"truera/trulens","url":"https://github.com/truera/trulens","category":"framework","desc":"Evaluation and tracking for LLM experiments and agents, built around feedback functions.","host":"OSS","mode":"both","judge":true,"lang":"Python","rag":true,"stars":3468},{"name":"LangWatch","repo":"langwatch/langwatch","url":"https://github.com/langwatch/langwatch","category":"framework","desc":"A platform for LLM evaluations and AI agent testing.","host":"OSS","mode":"both","judge":true,"lang":"Python/TS","rag":true,"stars":3427},{"name":"UpTrain","repo":"uptrain-ai/uptrain","url":"https://github.com/uptrain-ai/uptrain","category":"framework","desc":"20+ preconfigured checks plus root-cause analysis on failures.","host":"OSS","mode":"both","judge":true,"lang":"Python","rag":true,"stars":2356},{"name":"Deepchecks","repo":"deepchecks/deepchecks","url":"https://github.com/deepchecks/deepchecks","category":"framework","desc":"Continuous validation for models and data, extended to LLM apps.","host":"OSS","mode":"offline","judge":true,"lang":"Python","rag":false,"stars":4041},{"name":"Evidently","repo":"evidentlyai/evidently","url":"https://github.com/evidentlyai/evidently","category":"framework","desc":"Open-source ML/LLM observability with 100+ metrics for evaluation and monitoring.","host":"OSS","mode":"both","judge":true,"lang":"Python","rag":false,"stars":7763},{"name":"Weave","repo":"wandb/weave","url":"https://github.com/wandb/weave","category":"framework","desc":"A lightweight toolkit for tracking and evaluating LLM apps (by Weights & Biases).","host":"OSS","mode":"both","judge":true,"lang":"Python/TS","rag":false,"stars":1109},{"name":"Helicone","repo":"Helicone/helicone","url":"https://github.com/Helicone/helicone","category":"observability","desc":"Open-source LLM observability; one line of code to monitor, evaluate, and experiment.","stars":6013},{"name":"OpenLLMetry","repo":"traceloop/openllmetry","url":"https://github.com/traceloop/openllmetry","category":"observability","desc":"Open-source GenAI observability built on OpenTelemetry.","stars":7339},{"name":"Langtrace","repo":"Scale3-Labs/langtrace","url":"https://github.com/Scale3-Labs/langtrace","category":"observability","desc":"OpenTelemetry-based end-to-end tracing, evals, and metrics for LLM apps and vector DBs.","stars":1221},{"name":"AgentOps","repo":"AgentOps-AI/agentops","url":"https://github.com/AgentOps-AI/agentops","category":"observability","desc":"Agent monitoring, cost tracking, and benchmarking; integrates with CrewAI, OpenAI Agents SDK, LangChain, AutoGen, and more.","stars":5739},{"name":"NeMo Guardrails","repo":"NVIDIA/NeMo-Guardrails","url":"https://github.com/NVIDIA/NeMo-Guardrails","category":"guardrails","desc":"Programmable guardrails for LLM conversational systems (by NVIDIA).","stars":6829},{"name":"Guardrails AI","repo":"guardrails-ai/guardrails","url":"https://github.com/guardrails-ai/guardrails","category":"guardrails","desc":"Add input/output validators and structured guarantees to LLMs.","stars":7224},{"name":"LLM Guard","repo":"protectai/llm-guard","url":"https://github.com/protectai/llm-guard","category":"guardrails","desc":"A security toolkit for LLM interactions (PII, toxicity, injection).","stars":3200},{"name":"Rebuff","repo":"protectai/rebuff","url":"https://github.com/protectai/rebuff","category":"guardrails","desc":"A self-hardening prompt-injection detector.","stars":1517},{"name":"SWE-bench","repo":"princeton-nlp/SWE-bench","url":"https://github.com/princeton-nlp/SWE-bench","category":"benchmark","desc":"Can agents resolve real GitHub issues? The de facto coding-agent benchmark.","stars":5518},{"name":"τ-bench (tau-bench)","repo":"sierra-research/tau-bench","url":"https://github.com/sierra-research/tau-bench","category":"benchmark","desc":"Tool-agent-user interaction in realistic customer-service settings (by Sierra).","stars":1352},{"name":"AgentBench","repo":"THUDM/AgentBench","url":"https://github.com/THUDM/AgentBench","category":"benchmark","desc":"A comprehensive benchmark evaluating LLMs as agents across 8 environments (ICLR'24).","stars":3614},{"name":"WebArena","repo":"web-arena-x/webarena","url":"https://github.com/web-arena-x/webarena","category":"benchmark","desc":"A realistic, self-hostable web environment for autonomous agents.","stars":1568},{"name":"VisualWebArena","repo":"web-arena-x/visualwebarena","url":"https://github.com/web-arena-x/visualwebarena","category":"benchmark","desc":"WebArena extended to multimodal, visually-grounded web tasks.","stars":484},{"name":"BrowserGym","repo":"ServiceNow/BrowserGym","url":"https://github.com/ServiceNow/BrowserGym","category":"benchmark","desc":"A Gym environment for web-automation agents (by ServiceNow).","stars":1296},{"name":"OSWorld","repo":"xlang-ai/OSWorld","url":"https://github.com/xlang-ai/OSWorld","category":"benchmark","desc":"Benchmarking multimodal agents on open-ended tasks in real computer environments (NeurIPS 2024).","stars":3045},{"name":"AndroidWorld","repo":"google-research/android_world","url":"https://github.com/google-research/android_world","category":"benchmark","desc":"An environment and benchmark for autonomous mobile agents (by Google Research).","stars":835},{"name":"MLE-bench","repo":"openai/mle-bench","url":"https://github.com/openai/mle-bench","category":"benchmark","desc":"How well do agents perform at machine-learning engineering? (by OpenAI).","stars":1658},{"name":"ToolBench","repo":"OpenBMB/ToolBench","url":"https://github.com/OpenBMB/ToolBench","category":"benchmark","desc":"Training, serving, and evaluating LLMs for tool use (ICLR'24 spotlight).","stars":5715},{"name":"EvalGate","repo":"royalpinto007/evalgate","url":"https://github.com/royalpinto007/evalgate","category":"specialized","desc":"Prompt and agent regression CI as a GitHub Action; the build fails when your prompt gets dumber, with PR delta comments.","stars":0},{"name":"VoiceEval","repo":"royalpinto007/Voiceeval","url":"https://github.com/royalpinto007/Voiceeval","category":"specialized","desc":"Evaluation for voice agents; catches what text evals miss: mis-hearing, missing confirmation, latency, barge-in.","stars":0},{"name":"Agentrace","repo":"royalpinto007/Agentrace","url":"https://github.com/royalpinto007/Agentrace","category":"specialized","desc":"Observability for Claude Code subagents; reads session transcripts and flags results you shouldn't trust.","stars":0},{"name":"AnswerProof","repo":"royalpinto007/answerproof","url":"https://github.com/royalpinto007/answerproof","category":"specialized","desc":"Verifiable, tamper-evident receipts for RAG answers (Merkle inclusion proofs + Ed25519 signatures).","stars":0},{"name":"LLM Datasets","repo":"mlabonne/llm-datasets","url":"https://github.com/mlabonne/llm-datasets","category":"dataset","desc":"A curated list of datasets and tools for post-training and evaluation.","stars":4712}];
const UPDATED = "2026-07-29";
const CATS = {framework:"Frameworks",observability:"Observability",guardrails:"Guardrails",benchmark:"Benchmarks",specialized:"Specialized",dataset:"Datasets"};
let active = "all", q = "";

const chips = document.getElementById("chips");
[["all","All"], ...Object.entries(CATS)].forEach(([k,label])=>{
  const c=document.createElement("span"); c.className="chip"+(k==="all"?" on":""); c.textContent=label; c.dataset.k=k;
  c.onclick=()=>{active=k;[...chips.children].forEach(x=>x.classList.toggle("on",x.dataset.k===k));render();};
  chips.appendChild(c);
});
const qi=document.getElementById("q");
qi.oninput=()=>{q=qi.value.trim().toLowerCase();render();};

function flags(t){
  if(t.category!=="framework") return "";
  const f=[];
  f.push(t.host); f.push(t.mode==="both"?"offline+online":t.mode);
  if(t.judge) f.push("LLM-judge"); f.push(t.lang); if(t.rag) f.push("RAG");
  return '<div class="flags">'+f.map(x=>'<span class="flag">'+x+'</span>').join("")+'</div>';
}
function kfmt(n){return n==null?"":n>=1000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":""+n;}

function render(){
  const grid=document.getElementById("grid"); grid.innerHTML="";
  const rows=DATA.filter(t=>{
    if(active!=="all"&&t.category!==active) return false;
    if(!q) return true;
    return (t.name+" "+t.desc+" "+t.category+" "+(t.lang||"")).toLowerCase().includes(q);
  }).sort((a,b)=>(b.stars||0)-(a.stars||0));
  document.getElementById("count").textContent=rows.length+" of "+DATA.length+" shown";
  document.getElementById("empty").hidden=rows.length>0;
  for(const t of rows){
    const el=document.createElement("div"); el.className="card";
    el.innerHTML=
      '<div class="cat">'+(CATS[t.category]||t.category)+'</div>'+
      '<div class="h"><a href="'+t.url+'" target="_blank" rel="noopener">'+t.name+'</a>'+
      (t.stars!=null?'<span class="stars">★ '+kfmt(t.stars)+'</span>':'')+'</div>'+
      '<p class="desc">'+t.desc+'</p>'+flags(t);
    grid.appendChild(el);
  }
}
document.getElementById("updated").textContent = UPDATED ? ("Star counts updated "+UPDATED) : "Community-curated";
render();
</script>
</body>
</html>
